[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "faircredit"
version = "0.1.0"
description = "Explainable credit scoring: WoE scorecard vs gradient boosting, SHAP reason codes, fairness audit and a FastAPI service"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = [
  "numpy>=1.24",
  "pandas>=2.0",
  "scikit-learn>=1.6",
  "shap>=0.45",
  "joblib>=1.3",
  "fastapi>=0.110",
  "pydantic>=2.5",
  "uvicorn>=0.27",
  "tabulate>=0.9",
]

[project.optional-dependencies]
dev = ["pytest>=7", "httpx>=0.27", "ruff>=0.4", "matplotlib>=3.7"]

[tool.hatch.build.targets.wheel]
packages = ["src/faircredit"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
filterwarnings = ["ignore::UserWarning", "ignore::DeprecationWarning", "ignore::PendingDeprecationWarning"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["UP007", "B008"]  # B008: FastAPI Query() defaults are idiomatic

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["N803", "N806"]
